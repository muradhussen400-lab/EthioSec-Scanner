<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EthioSecScan</title>
    <link rel="stylesheet" href="logistyle.css">
</head>

<body>

    <!-- Background -->
    <div class="login-bg">
        <div class="glow-left"></div>
        <div class="glow-right"></div>
    </div>

    <!-- Login Container -->
    <div class="login-wrapper">
        <div class="login-card">

            <!-- Logo -->
            <div class="login-logo">
                <span class="logo-icon">◈</span>
                <span>EthioSec<span>Scan</span></span>
            </div>

            <!-- Heading -->
            <div class="login-header">
                <span class="section-label">WELCOME BACK</span>
                <h1>Sign In</h1>
                <p id="loginSubtext">Access your scanning dashboard and analyze your websites</p>
            </div>

            <!-- Login Form -->
            <form class="login-form" id="loginForm" novalidate>

                <!-- Inline error banner -->
                <div class="form-error" id="formError" role="alert" hidden></div>

                <!-- Email Input -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉</span>
                        <input type="email" id="email" placeholder="" required>
                    </div>
                    <span class="input-hint">Enter your registered email</span>
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔐</span>
                        <input type="password" id="password" placeholder="" required>
                        <button type="button" class="show-password" id="togglePasswordBtn">👁</button>
                    </div>
                    <span class="input-hint">At least 8 characters</span>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn" id="loginBtn">
                    <span>SIGN IN</span>
                    <span class="btn-arrow">→</span>
                </button>

            </form>

            <!-- Divider -->
            <div class="form-divider">
                <span>OR</span>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button type="button" class="social-btn google"
                    onclick="alert('Google authentication is configured in the cloud console.')">
                    <span>G</span>
                    Google
                </button>
                <button type="button" class="social-btn github"
                    onclick="alert('GitHub authentication is configured in the cloud console.')">
                    <span>⚙</span>
                    GitHub
                </button>
            </div>

            <!-- Sign Up Link -->
            <div class="signup-section">
                <p>Don't have an account?
                    <a href="signup.html" class="signup-link" id="signupLink">Create one</a>
                </p>
            </div>

            <!-- Footer Links -->
            <div class="login-footer">
                <a href="index.html">← Back to Home</a>
            </div>

        </div>

        <!-- Right Side Decoration -->
        <div class="login-visual">
            <div class="visual-circle circle-1"></div>
            <div class="visual-circle circle-2"></div>
            <div class="visual-ring"></div>
            <div class="visual-text">
                <div>SECURE</div>
                <div>LOGIN</div>
            </div>
        </div>

    </div>

    <!-- UI Controller -->
    <script src="loginjava.js"></script>
</body>

</html>
